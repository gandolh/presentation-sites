<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1500" width="1080" height="1500">
  
  <defs>
    <!-- Dusk sky: deep canopy at the top easing through a mid haze into a warm
         blue-hour band, with a hot sliver right at the horizon, then the dark
         field. The extra stops give real atmospheric depth instead of a flat
         two-tone wash. -->
    <linearGradient id="dusk" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0%" stop-color="#12211a"/>
      <stop offset="32%" stop-color="#1f3a2c"/>
      <stop offset="56%" stop-color="#4a6450"/>
      <stop offset="70%" stop-color="#8a7853"/>
      <stop offset="75%" stop-color="#c79a64"/>
      <stop offset="79%" stop-color="#365441"/>
      <stop offset="86%" stop-color="#2c4233"/>
      <stop offset="100%" stop-color="#1c2a20"/>
    </linearGradient>
    <!-- A wide, low glow sitting on the horizon line (the sun just gone). -->
    <radialGradient id="horizonGlow" cx="50%" cy="76%" r="62%" fx="50%" fy="76%">
      <stop offset="0%" stop-color="#c79a64" stop-opacity="0.5"/>
      <stop offset="38%" stop-color="#8a7853" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8a7853" stop-opacity="0"/>
    </radialGradient>
    <!-- The lamp: a hot near-white core falling off through clay to nothing.
         Three stops so the glow has a believable falloff, not a flat disc. -->
    <radialGradient id="lamp" cx="61%" cy="72%" r="44%">
      <stop offset="0%" stop-color="#fcd9a8" stop-opacity="0.85"/>
      <stop offset="22%" stop-color="#f0b985" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#d2864f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d2864f" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft vertical haze used to push distant elements back. -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6450" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a6450" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="guyline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fa178"/>
      <stop offset="100%" stop-color="#f0b985"/>
    </linearGradient>
    <!-- A faint vignette to seat the composition. -->
    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#12211a" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1500" fill="url(#dusk)"/>
  <rect width="1080" height="1500" fill="url(#horizonGlow)"/>
  
  <!-- far field, pushed back by haze -->
  <path d="M45.900000000000006,989.4 L154.764,923.25
    L216,948.765 L277.236,923.25 L386.1,989.4
    L386.1,1065 L45.900000000000006,1065 Z" fill="#4a6450" opacity="0.55"/>
    <path d="M45.900000000000006,989.4 L154.764,923.25
    L216,948.765 L277.236,923.25 L386.1,989.4
    L386.1,1065 L45.900000000000006,1065 Z" fill="#f3f4ec" opacity="0.12"/>
  <path d="M683.0999999999999,1005 L812.6999999999999,926.25
    L885.5999999999999,956.625 L958.4999999999999,926.25 L1088.1,1005
    L1088.1,1095 L683.0999999999999,1095 Z" fill="#4a6450" opacity="0.55"/>
    <path d="M683.0999999999999,1005 L812.6999999999999,926.25
    L885.5999999999999,956.625 L958.4999999999999,926.25 L1088.1,1005
    L1088.1,1095 L683.0999999999999,1095 Z" fill="#f3f4ec" opacity="0.12"/>
  <line x1="0" y1="990" x2="1080" y2="990" stroke="#c79a64" stroke-width="1.5" opacity="0.25"/>
  <rect x="0" y="990" width="1080" height="150" fill="url(#haze)"/>
  <!-- ground plane -->
  <line x1="0" y1="1260" x2="1080" y2="1260" stroke="#5d7a64" stroke-width="2" opacity="0.35"/>
  <!-- string lights arc above the subject -->
  <path d="M0,330 Q540,358 1080,330" fill="none" stroke="#5d7a64" stroke-width="1.5" opacity="0.5"/><circle cx="0.0" cy="330.0" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="120.0" cy="339.6" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="240.0" cy="348.0" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="360.0" cy="354.2" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="480.0" cy="357.6" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="600.0" cy="357.6" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="720.0" cy="354.2" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="840.0" cy="348.0" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="960.0" cy="339.6" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="1080.0" cy="330.0" r="3.5" fill="#f0b985" opacity="0.9"/>
  <g>
    <ellipse cx="669.6" cy="1269" rx="502.2" ry="22.5" fill="#12211a" opacity="0.4"/>
    <path d="M264.6,1080
    L523.8000000000001,922.5
    L669.6,983.25
    L815.4,922.5
    L1074.6,1080
    L1074.6,1260
    L264.6,1260 Z" fill="#f3f4ec" opacity="0.97"/>
    <path d="M669.6,983.25
    L523.8000000000001,922.5 L264.6,1080 L264.6,1260 L669.6,1260 Z" fill="#cdd2c2" opacity="0.55"/>
    <path d="M669.6,983.25
    L815.4,922.5 L1074.6,1080 L1074.6,1260 L669.6,1260 Z" fill="#f0b985" opacity="0.16"/>
    <path d="M264.6,1080
    L523.8000000000001,922.5
    L669.6,983.25
    L815.4,922.5
    L1074.6,1080 L1074.6,1080" fill="none" stroke="#3a6b46" stroke-width="5.625" opacity="0.32"/>
    <line x1="669.6" y1="983.25" x2="669.6" y2="1260" stroke="#3a6b46" stroke-width="3.375" opacity="0.22"/>
    <line x1="523.8000000000001" y1="922.5" x2="523.8000000000001" y2="1260" stroke="#3a6b46" stroke-width="3.375" opacity="0.22"/>
    <line x1="815.4" y1="922.5" x2="815.4" y2="1260" stroke="#3a6b46" stroke-width="3.375" opacity="0.22"/>
    <path d="M566.1,1260
         L566.1,1094.4
         Q669.6,1053 773.1,1094.4
         L773.1,1260 Z" fill="#f0b985" opacity="0.9"/>
       <path d="M602.1,1260
         L602.1,1119.6
         Q669.6,1089 737.1,1119.6
         L737.1,1260 Z" fill="#f6f4ea" opacity="0.85"/>
    <!-- guy ropes -->
    <line x1="264.6" y1="1080" x2="188.10000000000002" y2="1260" stroke="#6fa178" stroke-width="3.375" opacity="0.55"/>
    <line x1="1074.6" y1="1080" x2="1151.1" y2="1260" stroke="#6fa178" stroke-width="3.375" opacity="0.55"/>
  </g>
  <rect width="1080" height="1500" fill="url(#lamp)"/>
  <rect width="1080" height="1500" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#guyline)"/>
  
</svg>