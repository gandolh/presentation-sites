<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  
  <defs>
    <!-- Dusk sky: deep canopy at the top easing through a mid haze into a warm
         blue-hour band, with a hot sliver right at the horizon, then the dark
         field. The extra stops give real atmospheric depth instead of a flat
         two-tone wash. -->
    <linearGradient id="dusk" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0%" stop-color="#12211a"/>
      <stop offset="32%" stop-color="#1f3a2c"/>
      <stop offset="56%" stop-color="#4a6450"/>
      <stop offset="70%" stop-color="#8a7853"/>
      <stop offset="75%" stop-color="#c79a64"/>
      <stop offset="79%" stop-color="#365441"/>
      <stop offset="86%" stop-color="#2c4233"/>
      <stop offset="100%" stop-color="#1c2a20"/>
    </linearGradient>
    <!-- A wide, low glow sitting on the horizon line (the sun just gone). -->
    <radialGradient id="horizonGlow" cx="50%" cy="76%" r="62%" fx="50%" fy="76%">
      <stop offset="0%" stop-color="#c79a64" stop-opacity="0.5"/>
      <stop offset="38%" stop-color="#8a7853" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8a7853" stop-opacity="0"/>
    </radialGradient>
    <!-- The lamp: a hot near-white core falling off through clay to nothing.
         Three stops so the glow has a believable falloff, not a flat disc. -->
    <radialGradient id="lamp" cx="61%" cy="72%" r="44%">
      <stop offset="0%" stop-color="#fcd9a8" stop-opacity="0.85"/>
      <stop offset="22%" stop-color="#f0b985" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#d2864f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d2864f" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft vertical haze used to push distant elements back. -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6450" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a6450" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="guyline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fa178"/>
      <stop offset="100%" stop-color="#f0b985"/>
    </linearGradient>
    <!-- A faint vignette to seat the composition. -->
    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#12211a" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dusk)"/>
  <rect width="1200" height="630" fill="url(#horizonGlow)"/>
  
  <!-- far field, pushed back by haze -->
  <path d="M140.77499999999998,403.2 L204.279,364.6125
    L240,379.49625000000003 L275.721,364.6125 L339.225,403.2
    L339.225,447.3 L140.77499999999998,447.3 Z" fill="#4a6450" opacity="0.55"/>
    <path d="M140.77499999999998,403.2 L204.279,364.6125
    L240,379.49625000000003 L275.721,364.6125 L339.225,403.2
    L339.225,447.3 L140.77499999999998,447.3 Z" fill="#f3f4ec" opacity="0.12"/>
  <path d="M865.8749999999999,407.40000000000003 L941.4749999999999,361.46250000000003
    L983.9999999999999,379.18125000000003 L1026.5249999999999,361.46250000000003 L1102.125,407.40000000000003
    L1102.125,459.90000000000003 L865.8749999999999,459.90000000000003 Z" fill="#4a6450" opacity="0.55"/>
    <path d="M865.8749999999999,407.40000000000003 L941.4749999999999,361.46250000000003
    L983.9999999999999,379.18125000000003 L1026.5249999999999,361.46250000000003 L1102.125,407.40000000000003
    L1102.125,459.90000000000003 L865.8749999999999,459.90000000000003 Z" fill="#f3f4ec" opacity="0.12"/>
  <line x1="0" y1="415.8" x2="1200" y2="415.8" stroke="#c79a64" stroke-width="1.5" opacity="0.25"/>
  <rect x="0" y="415.8" width="1200" height="63" fill="url(#haze)"/>
  <!-- ground plane -->
  <line x1="0" y1="529.1999999999999" x2="1200" y2="529.1999999999999" stroke="#5d7a64" stroke-width="2" opacity="0.35"/>
  <!-- string lights arc above the subject -->
  <path d="M0,138.6 Q600,166.6 1200,138.6" fill="none" stroke="#5d7a64" stroke-width="1.5" opacity="0.5"/><circle cx="0.0" cy="138.6" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="133.3" cy="148.2" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="266.7" cy="156.6" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="400.0" cy="162.8" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="533.3" cy="166.2" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="666.7" cy="166.2" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="800.0" cy="162.8" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="933.3" cy="156.6" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="1066.7" cy="148.2" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="1200.0" cy="138.6" r="3.5" fill="#f0b985" opacity="0.9"/>
  <g>
    <ellipse cx="744" cy="534.4499999999999" rx="292.95" ry="13.125" fill="#12211a" opacity="0.4"/>
    <path d="M507.75,424.19999999999993
    L658.95,332.32499999999993
    L744,367.76249999999993
    L829.05,332.32499999999993
    L980.25,424.19999999999993
    L980.25,529.1999999999999
    L507.75,529.1999999999999 Z" fill="#f3f4ec" opacity="0.97"/>
    <path d="M744,367.76249999999993
    L658.95,332.32499999999993 L507.75,424.19999999999993 L507.75,529.1999999999999 L744,529.1999999999999 Z" fill="#cdd2c2" opacity="0.55"/>
    <path d="M744,367.76249999999993
    L829.05,332.32499999999993 L980.25,424.19999999999993 L980.25,529.1999999999999 L744,529.1999999999999 Z" fill="#f0b985" opacity="0.16"/>
    <path d="M507.75,424.19999999999993
    L658.95,332.32499999999993
    L744,367.76249999999993
    L829.05,332.32499999999993
    L980.25,424.19999999999993 L980.25,424.19999999999993" fill="none" stroke="#3a6b46" stroke-width="3.28125" opacity="0.32"/>
    <line x1="744" y1="367.76249999999993" x2="744" y2="529.1999999999999" stroke="#3a6b46" stroke-width="1.96875" opacity="0.22"/>
    <line x1="658.95" y1="332.32499999999993" x2="658.95" y2="529.1999999999999" stroke="#3a6b46" stroke-width="1.96875" opacity="0.22"/>
    <line x1="829.05" y1="332.32499999999993" x2="829.05" y2="529.1999999999999" stroke="#3a6b46" stroke-width="1.96875" opacity="0.22"/>
    <path d="M683.625,529.1999999999999
         L683.625,432.5999999999999
         Q744,408.44999999999993 804.375,432.5999999999999
         L804.375,529.1999999999999 Z" fill="#f0b985" opacity="0.9"/>
       <path d="M704.625,529.1999999999999
         L704.625,447.29999999999995
         Q744,429.44999999999993 783.375,447.29999999999995
         L783.375,529.1999999999999 Z" fill="#f6f4ea" opacity="0.85"/>
    <!-- guy ropes -->
    <line x1="507.75" y1="424.19999999999993" x2="463.125" y2="529.1999999999999" stroke="#6fa178" stroke-width="1.96875" opacity="0.55"/>
    <line x1="980.25" y1="424.19999999999993" x2="1024.875" y2="529.1999999999999" stroke="#6fa178" stroke-width="1.96875" opacity="0.55"/>
  </g>
  <rect width="1200" height="630" fill="url(#lamp)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#guyline)"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="50%" y="602.5" text-anchor="middle" font-size="25" font-weight="700" fill="#f6f4ea" opacity="0.9">Subcort · corturi pentru evenimente</text>
  </g>
</svg>