<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  
  <defs>
    <!-- Dusk sky: deep canopy at the top easing through a mid haze into a warm
         blue-hour band, with a hot sliver right at the horizon, then the dark
         field. The extra stops give real atmospheric depth instead of a flat
         two-tone wash. -->
    <linearGradient id="dusk" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0%" stop-color="#12211a"/>
      <stop offset="32%" stop-color="#1f3a2c"/>
      <stop offset="56%" stop-color="#4a6450"/>
      <stop offset="70%" stop-color="#8a7853"/>
      <stop offset="75%" stop-color="#c79a64"/>
      <stop offset="79%" stop-color="#365441"/>
      <stop offset="86%" stop-color="#2c4233"/>
      <stop offset="100%" stop-color="#1c2a20"/>
    </linearGradient>
    <!-- A wide, low glow sitting on the horizon line (the sun just gone). -->
    <radialGradient id="horizonGlow" cx="50%" cy="76%" r="62%" fx="50%" fy="76%">
      <stop offset="0%" stop-color="#c79a64" stop-opacity="0.5"/>
      <stop offset="38%" stop-color="#8a7853" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8a7853" stop-opacity="0"/>
    </radialGradient>
    <!-- The lamp: a hot near-white core falling off through clay to nothing.
         Three stops so the glow has a believable falloff, not a flat disc. -->
    <radialGradient id="lamp" cx="50%" cy="64%" r="46%">
      <stop offset="0%" stop-color="#fcd9a8" stop-opacity="0.85"/>
      <stop offset="22%" stop-color="#f0b985" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#d2864f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d2864f" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft vertical haze used to push distant elements back. -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6450" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a6450" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="guyline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fa178"/>
      <stop offset="100%" stop-color="#f0b985"/>
    </linearGradient>
    <!-- A faint vignette to seat the composition. -->
    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#12211a" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#dusk)"/>
  <rect width="1000" height="750" fill="url(#horizonGlow)"/>
  
  <!-- canopy ceiling lines -->
  <path d="M0,120 L500,45 L1000,120" fill="none" stroke="#5d7a64" stroke-width="2" opacity="0.4"/>
  <rect x="0" y="120" width="1000" height="30" fill="#365441" opacity="0.4"/>
  <path d="M0,180 Q500,208 1000,180" fill="none" stroke="#5d7a64" stroke-width="1.5" opacity="0.5"/><circle cx="0.0" cy="180.0" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="142.9" cy="192.1" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="285.7" cy="201.9" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="428.6" cy="207.3" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="571.4" cy="207.3" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="714.3" cy="201.9" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="857.1" cy="192.1" r="3.5" fill="#f0b985" opacity="0.9"/><circle cx="1000.0" cy="180.0" r="3.5" fill="#f0b985" opacity="0.9"/>
  <line x1="0" y1="630" x2="1000" y2="630" stroke="#5d7a64" stroke-width="2" opacity="0.45"/>
  <ellipse cx="220" cy="600" rx="42" ry="14" fill="#f3f4ec" opacity="0.92"/>
        <rect x="216" y="600" width="8" height="22" fill="#5d7a64" opacity="0.5"/><ellipse cx="500" cy="600" rx="42" ry="14" fill="#f3f4ec" opacity="0.92"/>
        <rect x="496" y="600" width="8" height="22" fill="#5d7a64" opacity="0.5"/><ellipse cx="780" cy="600" rx="42" ry="14" fill="#f3f4ec" opacity="0.92"/>
        <rect x="776" y="600" width="8" height="22" fill="#5d7a64" opacity="0.5"/><ellipse cx="220" cy="435" rx="34.440000000000005" ry="11.48" fill="#f3f4ec" opacity="0.77"/>
        <rect x="216" y="435" width="8" height="18.040000000000003" fill="#5d7a64" opacity="0.5"/><ellipse cx="500" cy="435" rx="34.440000000000005" ry="11.48" fill="#f3f4ec" opacity="0.77"/>
        <rect x="496" y="435" width="8" height="18.040000000000003" fill="#5d7a64" opacity="0.5"/><ellipse cx="780" cy="435" rx="34.440000000000005" ry="11.48" fill="#f3f4ec" opacity="0.77"/>
        <rect x="776" y="435" width="8" height="18.040000000000003" fill="#5d7a64" opacity="0.5"/>
  <rect width="1000" height="750" fill="url(#lamp)"/>
  <rect width="1000" height="750" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1000" height="5" fill="url(#guyline)"/>
  
</svg>