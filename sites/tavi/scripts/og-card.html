  .m-black {
    --pf: var(--color-tool-black);
    --po: var(--color-tool-black-line);
    --pg: var(--color-surface);
  }
  .m-yellow {
    --pf: var(--color-tool-yellow);
    --po: var(--color-tool-yellow-line);
  }
  .m-red {
    --pf: var(--color-tool-red);
    --po: var(--color-tool-red-line);
  }
  .m-grey {
    --pf: var(--color-tool-grey);
    --po: var(--color-tool-grey-line);
  }
  .m-violet {
    --pf: var(--color-tool-violet);
    --po: var(--color-tool-violet-line);
  }
  .mode-bench .m :is(.fo, .ln, .knurl, .rim, .glint) {
    vector-effect: non-scaling-stroke;
  }
  /* At its real size the movement is a fifth of the hero's: its outlines would scale to a quarter of a pixel, so they
     too keep a set weight on screen, finer than the tools'. */
  .mode-bench .held .fo {
    vector-effect: non-scaling-stroke;
    stroke-width: 0.6;
  }
  .mode-bench .m .ln,
  .mode-bench .m .rim {
    fill: none;
    stroke: var(--po);
    stroke-width: 0.8;
  }
  .mode-bench .m .rim {
    stroke-width: 1.1;
  }
  .mode-bench .knurl {
    fill: none;
    stroke: var(--po);
    stroke-width: 0.6;
    opacity: 0.55;
  }
  .mode-bench .glint {
    fill: none;
    stroke: var(--pg);
    stroke-width: 1.6;
    stroke-linecap: round;
  }
  /* Step 3: the loupe slides from its place on the mat until its lens is over the balance. */
  .mode-bench .slide {
    transition: transform var(--dur-long) var(--ease-out);
  }
  .stage[data-step="3"] .mode-bench .slide {
    transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px));
  }

  /* Ticking. Each turning group pivots on its own centre (the translate around it). The balance swings once a beat;
     the escape wheel steps half a tooth a beat, 30 steps to a turn in 5 s; the pallet fork flips each beat; the
     fourth wheel steps a degree a beat, one turn a minute; the third and centre wheels creep. */
  .rot {
    transform-box: view-box;
    transform-origin: 0 0;
  }
  .js:root[data-playing="true"] .rot-balance {
    animation: swing calc(var(--beat) * var(--slow)) var(--ease-swing) calc(var(--beat) * var(--slow) * -0.5) infinite
      alternate;
  }
  .js:root[data-playing="true"] .rot-escape {
    animation: turn calc(5s * var(--slow)) steps(30, jump-start) infinite;
  }
  .js:root[data-playing="true"] .rot-pallet {
    animation: flip calc(var(--beat) * 2 * var(--slow)) step-end infinite;
  }
  .js:root[data-playing="true"] .rot-fourth {
    animation: turn-back calc(60s * var(--slow)) steps(360, jump-start) infinite;
  }
  .js:root[data-playing="true"] .rot-third {
    animation: turn calc(450s * var(--slow)) linear infinite;
  }
  .js:root[data-playing="true"] .rot-centre {
    animation: turn-back calc(3600s * var(--slow)) linear infinite;
  }
  /* The hands, seen on the dial, all clockwise: the small seconds a degree a beat as the fourth wheel steps, the minute
     hand once an hour with the centre wheel, the hour hand once in twelve. */
  .js:root[data-playing="true"] .rot-hand-seconds {
    animation: turn calc(60s * var(--slow)) steps(360, jump-start) infinite;
  }
  .js:root[data-playing="true"] .rot-hand-minute {
    animation: turn calc(3600s * var(--slow)) linear infinite;
  }
  .js:root[data-playing="true"] .rot-hand-hour {
    animation: turn calc(43200s * var(--slow)) linear infinite;
  }
  /* Chapter 2's train turns the barrel too: once in six hours, the way the escape wheel turns. */
  .js:root[data-playing="true"] .mode-train .rot-barrel {
    animation: turn calc(21600s * var(--slow)) linear infinite;
  }
  /* The movement on the bench is let down, waiting for its service: nothing on the bench ticks or loops. */
  .js:root[data-playing="true"] .mode-bench .rot {
    animation: none;
  }

  @media (max-width: 40rem) {
    .callout text {
      font-size: 20px;
    }
    .closeup .window text {
      font-size: 5.6px;
    }
    .ratio text {
      font-size: 22px;
    }
  }
  /* Reduced motion: the head script starts the page paused, so nothing turns until a Pause is released; moves between
     poses jump. */
  @media (prefers-reduced-motion: reduce) {
    .lift,
    .lift-w,
    .lift-w .spin,
    .mode-whole > .mv,
    .mode-bench .slide,
    .movement .part {
      transition: none;
    }
  }
}

@keyframes swing {
  from {
    transform: rotate(-140deg);
  }
  to {
    transform: rotate(140deg);
  }
}
@keyframes turn {
  to {
    transform: rotate(360deg);
  }
}
@keyframes turn-back {
  to {
    transform: rotate(-360deg);
  }
}
@keyframes flip {
  0% {
    transform: rotate(7deg);
  }
  50% {
    transform: rotate(-7deg);
  }
  100% {
    transform: rotate(7deg);
  }
}
