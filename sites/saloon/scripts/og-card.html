  rest show when a link to this site is shared.

  authored in HTML so it uses the site's REAL self-hosted faces (Fraunces with
  its SOFT axis, and Manrope) rather than a renderer's fallback, which would also
  leave the Romanian diacritics to whatever font it picked. The words are the
  site's own: site.name, site.tagline, site.description.

  public/images/og-image.png (keep it under 300 KB — WhatsApp drops larger
  previews). Fonts resolve from the repo-root node_modules.
-->
