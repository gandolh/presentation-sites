<!--
  SOURCE for public/images/og-image.png.

  Social platforms (Facebook, WhatsApp, X, LinkedIn, Slack, iMessage) refuse an
  SVG for og:image, so the card ships as a PNG. It is authored here in HTML so
  it can use the site's REAL self-hosted faces — Archivo on its width axis and
  Hanken Grotesk — instead of a renderer's fallback grotesque, which would also
  put the Romanian diacritics at the mercy of whatever font it picked.

  public/images/og-image.png. Fonts resolve from the repo-root node_modules.
-->

const tR=R-30;
