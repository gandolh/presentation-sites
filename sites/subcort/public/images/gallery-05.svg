    <line x1="620" y1="436.2096774193549" x2="620" y2="585" stroke="#3a6b46" stroke-width="1.814516129032258" opacity="0.22"/>
    <line x1="541.6129032258065" y1="403.54838709677415" x2="541.6129032258065" y2="585" stroke="#3a6b46" stroke-width="1.814516129032258" opacity="0.22"/>
