    L354,475
    L450,533.3333333333334 L450,533.3333333333334" fill="none" stroke="#3a6b46" stroke-width="2.0833333333333335" opacity="0.32"/>
    <line x1="300" y1="497.5" x2="300" y2="600" stroke="#3a6b46" stroke-width="1.25" opacity="0.22"/>
    <line x1="246" y1="475" x2="246" y2="600" stroke="#3a6b46" stroke-width="1.25" opacity="0.22"/>
    <line x1="354" y1="475" x2="354" y2="600" stroke="#3a6b46" stroke-width="1.25" opacity="0.22"/>
    
    <!-- guy ropes -->
    <line x1="150" y1="533.3333333333334" x2="121.66666666666666" y2="600" stroke="#6fa178" stroke-width="1.25" opacity="0.55"/>
    <line x1="450" y1="533.3333333333334" x2="478.3333333333333" y2="600" stroke="#6fa178" stroke-width="1.25" opacity="0.55"/>
  </g>
  <g>
