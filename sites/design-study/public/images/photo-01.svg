<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#EDE7DE"/>
      <stop offset="100%" stop-color="#B4704A" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#B4704A"/>
      <stop offset="55%" stop-color="#3B3129" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#3B3129"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B4704A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3B3129" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Film grain. Kept subtle; sepia and high-contrast treatments amplify it. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="0" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#ground)"/>
  
    <ellipse cx="330" cy="1130" rx="300" ry="46" fill="#3B3129" opacity="0.22"/>
    <circle cx="380" cy="880" r="270" fill="url(#sphere)"/>
    <rect x="0" y="0" width="1080" height="470" fill="#B4704A" opacity="0.16"/>
  <rect width="1080" height="1350" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
</svg>
