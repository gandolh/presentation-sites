<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F0E9E6"/>
      <stop offset="100%" stop-color="#A67A5E" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#A67A5E"/>
      <stop offset="55%" stop-color="#3D3029" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#3D3029"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A67A5E" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3D3029" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Film grain. Kept subtle; sepia and high-contrast treatments amplify it. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="119" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#ground)"/>
  
    <polygon points="0,340 780,140 780,900 0,1120" fill="#3D3029" opacity="0.8"/>
    <polygon points="380,520 1080,300 1080,1080 380,1260" fill="#A67A5E" opacity="0.75"/>
    <rect x="0" y="1240" width="1080" height="110" fill="#3D3029" opacity="0.5"/>
  <rect width="1080" height="1350" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
</svg>
