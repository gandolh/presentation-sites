<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F1ECE4"/>
      <stop offset="100%" stop-color="#AE8B58" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#AE8B58"/>
      <stop offset="55%" stop-color="#3E3527" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#3E3527"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AE8B58" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3E3527" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Film grain. Kept subtle; sepia and high-contrast treatments amplify it. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="105" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#ground)"/>
  
    <rect x="140" y="260" width="800" height="150" fill="#3E3527" opacity="0.88"/>
    <rect x="140" y="470" width="560" height="150" fill="#AE8B58" opacity="0.9"/>
    <rect x="140" y="680" width="800" height="150" fill="#3E3527" opacity="0.55"/>
    <rect x="140" y="890" width="380" height="150" fill="#AE8B58" opacity="0.7"/>
  <rect width="1080" height="1350" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
</svg>
