<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#E6EAEA"/>
      <stop offset="100%" stop-color="#5C8A82" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#5C8A82"/>
      <stop offset="55%" stop-color="#213330" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#213330"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C8A82" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#213330" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Film grain. Kept subtle; sepia and high-contrast treatments amplify it. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="49" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#ground)"/>
  
    <rect x="0" y="760" width="1080" height="590" fill="#213330" opacity="0.82"/>
    <rect x="620" y="330" width="250" height="640" fill="#5C8A82" opacity="0.85"/>
    <circle cx="290" cy="360" r="130" fill="#5C8A82" opacity="0.5"/>
  <rect width="1080" height="1350" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
</svg>
